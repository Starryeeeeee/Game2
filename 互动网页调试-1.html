<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智启未来 · 脑机接口科普讲座 · 海龟汤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0e1a;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    color: #eaf7ff;
    user-select: none; -webkit-user-select: none;
  }

  #vanta-bg { position: fixed; inset: 0; z-index: 0; }

  #terminal {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    width: min(92vw, 1360px);
    height: min(88vh, 940px);
    background: rgba(6, 12, 24, 0.92);
    border: 1px solid rgba(90, 142, 200, 0.4);
    border-radius: 10px;
    box-shadow:
      0 0 90px rgba(40, 90, 150, 0.28),
      0 0 0 1px rgba(90,142,200,.08),
      inset 0 0 70px rgba(30, 70, 120, 0.08);
    font-family: "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(8px);
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  #terminal.show { opacity: 1; }

  .term-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 24px;
    background: rgba(10, 20, 36, 0.75);
    border-bottom: 1px solid rgba(90, 142, 200, 0.22);
    flex-shrink: 0;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .dot.red    { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green  { background: #27c93f; }
  .term-title {
    margin-left: 14px;
    font-size: 16px;
    letter-spacing: .18em;
    color: rgba(140, 180, 220, 0.72);
  }
  .term-meta {
    margin-left: auto;
    font-size: 16px;
    letter-spacing: .12em;
    color: rgba(120, 170, 220, 0.6);
  }

  .term-body {
    flex: 1;
    padding: 38px 46px;
    overflow-y: auto;
    font-size: 27px;
    line-height: 1.85;
    color: #c8ddf4;
  }
  .term-body::-webkit-scrollbar { width: 7px; }
  .term-body::-webkit-scrollbar-thumb {
    background: rgba(90,142,200,.3);
    border-radius: 3px;
  }

  .term-body > div {
    white-space: pre-wrap;
    word-break: break-word;
  }

  .line-log     { color: rgba(150, 195, 235, 0.72); }
  .line-prompt  { color: rgba(180, 215, 245, 0.92); }
  .line-info    { color: rgba(175, 210, 245, 0.78); }
  .line-success { color: #85f0b8; margin-top: 12px; }
  .line-error   { color: #ff9fae; margin-top: 12px; }
  .line-answer  { color: #ffdc95; }
  .line-explain { color: rgba(200, 225, 248, 0.9); }

  .line-soup {
    color: #e8f4ff;
    font-size: 29px;
    line-height: 2.05;
    margin: 4px 0;
  }
  .line-soup-key {
    color: #ffdc95;
    font-size: 29px;
    line-height: 2.05;
    font-weight: 600;
    margin: 4px 0;
    text-shadow: 0 0 22px rgba(255, 220, 149, 0.3);
  }

  .line-q-record { color: #e8f4ff; margin-top: 10px; }
  .line-a-record { margin-top: 0; color: rgba(200, 225, 248, 0.9); }

  .answer-yes    { color: #85f0b8; font-weight: 700; letter-spacing: .06em; }
  .answer-no     { color: #ff9fae; font-weight: 700; letter-spacing: .06em; }
  .answer-irrel  { color: #a8b8c8; font-weight: 700; letter-spacing: .06em; }
  .answer-both   { color: #ffdc95; font-weight: 700; letter-spacing: .06em; }
  .answer-cannot { color: #8ed0f0; font-weight: 700; letter-spacing: .06em; }

  .line-hint { color: #d4bfff; }

  .line-ask {
    color: #ffdc95;
    margin-top: 12px;
    font-weight: 600;
    text-shadow: 0 0 18px rgba(255, 220, 149, 0.25);
  }

  /* 跳动的三个点 */
  .dot-jump {
    display: inline-block;
    margin-left: 0.12em;
    white-space: nowrap;
  }
  .dot-jump > span {
    display: inline-block;
    animation: dotJump 1.35s ease-in-out infinite;
    will-change: transform, opacity;
  }
  .dot-jump > span:nth-child(1) { animation-delay: 0s; }
  .dot-jump > span:nth-child(2) { animation-delay: .18s; }
  .dot-jump > span:nth-child(3) { animation-delay: .36s; }
  @keyframes dotJump {
    0%, 60%, 100% { transform: translateY(0);      opacity: .45; }
    30%           { transform: translateY(-.28em); opacity: 1; }
  }

  .line-input-line {
    display: flex;
    align-items: center;
    margin-top: 14px;
    white-space: pre;
    cursor: text;
  }
  .input-prefix {
    color: #79a8dc;
    flex-shrink: 0;
    white-space: pre;
  }
  .inline-input {
    flex: 0 1 auto;
    min-width: 4px;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    color: #f2fbff;
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    letter-spacing: inherit;
    caret-color: transparent;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    user-select: text; -webkit-user-select: text;
    transition: color .35s ease;
  }
  .inline-input.locked {
    color: rgba(210, 232, 250, 0.92);
    pointer-events: none;
  }

  .block-cursor {
    display: inline-block;
    width: 13px;
    height: 27px;
    background: #8ed0f0;
    margin-left: 4px;
    flex-shrink: 0;
    box-shadow: 0 0 10px rgba(126, 200, 232, 0.6);
    animation: blink .75s steps(1) infinite;
    transition: opacity .3s ease;
  }
  .block-cursor.fading { opacity: 0; animation: none; }
  @keyframes blink { 50% { opacity: 0; } }

  #flash {
    position: fixed; inset: 0;
    background: #cfe8ff;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity .45s ease;
  }
  #flash.on { opacity: .35; }

  #enterOverlay {
    position: fixed; inset: 0;
    z-index: 200;
    background: rgba(6, 12, 24, 0.94);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 1.1s ease;
  }
  #enterOverlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .enter-inner {
    display: flex;
    align-items: center;
    gap: 32px;
    animation: enterFadeIn 1.2s ease .3s both;
  }
  @keyframes enterFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .enter-pulse {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #b8d4f0;
    box-shadow: 0 0 24px rgba(140,200,255,.9);
    animation: enterPulse 1.8s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes enterPulse {
    0%, 100% {
      transform: scale(1);
      opacity: .6;
      box-shadow: 0 0 16px rgba(140,200,255,.7);
    }
    50% {
      transform: scale(1.5);
      opacity: 1;
      box-shadow: 0 0 44px rgba(140,200,255,1),
                  0 0 88px rgba(90,142,200,.6);
    }
  }

  .enter-text {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(36px, 4vw, 64px);
    letter-spacing: .08em;
    color: rgba(210,232,250,.95);
    text-shadow: 0 0 34px rgba(90,142,200,.55),
                 0 0 68px rgba(90,142,200,.25);
    line-height: 1;
  }

  #cover {
    position: fixed; inset: 0;
    z-index: 10;
    pointer-events: none;
    transition: opacity 1.5s ease .5s;
  }
  #cover.done { opacity: 0; }

  .cover-top {
    position: absolute;
    top: 13vh;
    left: 8vw;
    display: flex;
    align-items: center;
    gap: 28px;
    transition: transform 1.9s cubic-bezier(.6,.05,.2,1), opacity 1.6s ease;
  }
  .cover-top img {
    height: 118px;
    width: auto;
    filter: drop-shadow(0 0 22px rgba(90,142,200,.62));
  }

  .club-name {
    font-family: 'AliHYAiHei-Beta', "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    font-size: 52px;
    font-weight: 400;
    letter-spacing: .24em;
    color: rgba(200,225,245,.92);
    text-shadow: 0 0 26px rgba(90,142,200,.42);
    line-height: 1;
    transform: translateY(-2px);
  }

  .title-group {
    position: absolute;
    left: 8vw;
    top: 49%;
    transform: translateY(-50%);
    max-width: 75vw;
    opacity: 0;
    transition: opacity .9s ease;
  }
  #cover.ready .title-group { opacity: 1; }

  .kicker {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(26px, 2.4vw, 40px);
    letter-spacing: .06em;
    color: rgba(180,212,240,.85);
    margin-bottom: 30px;
    transition: transform 1.9s cubic-bezier(.6,.05,.2,1), opacity 1.6s ease;
    min-height: 1.15em;
  }

  .typing-cursor {
    display: inline-block;
    width: 0.075em;
    height: 0.92em;
    vertical-align: -0.08em;
    margin-left: 0.1em;
    background: #b8d4f0;
    opacity: 0.9;
    animation: typingBlink .7s steps(1) infinite;
    transition: opacity .5s ease;
  }
  .typing-cursor.fade { opacity: 0; }
  @keyframes typingBlink { 50% { opacity: 0; } }

  @keyframes charSlideIn {
    from { transform: translateX(90px); opacity: 0; filter: blur(4px); }
    to   { transform: translateX(0);    opacity: 1; filter: blur(0); }
  }
  .char-span {
    display: inline-block;
    white-space: pre;
    animation: charSlideIn 1.05s cubic-bezier(.22,1,.36,1) both;
    will-change: transform, opacity, filter;
  }
  .title .char-span { margin-right: .18em; }
  .title .char-span:last-child { margin-right: 0; }

  .title {
    font-family: 'Alibaba PuHuiTi 3.0', 'Alibaba PuHuiTi', 'AlibabaPuHuiTi',
                 'Alibaba PuHuiTi 2.0', '阿里巴巴普惠体',
                 "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    font-size: clamp(64px, 9.5vw, 160px);
    font-weight: 800;
    letter-spacing: .18em;
    line-height: 1.05;
    transition: transform 2.2s cubic-bezier(.6,.05,.2,1), opacity 1.9s ease;
  }

  .title .char-span {
    background: linear-gradient(180deg, #eaf4ff 0%, #b8d4f0 28%, #7eaed4 62%, #4d80b0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(90,142,200,.42));
  }

  .subtitle-cn {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    font-size: clamp(21px, 1.75vw, 31px);
    letter-spacing: .32em;
    color: #cfeeff;
    font-weight: 500;
    margin-top: 40px;
    padding: .22em 0 .18em 24px;
    text-shadow: 0 0 22px rgba(90,142,200,.5);
    transition: transform 2.2s cubic-bezier(.6,.05,.2,1), opacity 1.9s ease;
    overflow: hidden;
  }
  .subtitle-cn .condense-span {
    display: inline-block;
    white-space: pre;
    margin-right: .32em;
  }
  .subtitle-cn .condense-span:last-child { margin-right: 0; }

  .split-up    { transform: translateY(-60vh) !important; opacity: 0 !important; }
  .split-left  { transform: translateX(-90vw) !important; opacity: 0 !important; }
  .split-right { transform: translateX(90vw) !important;  opacity: 0 !important; }
  .cover-top.split-up .club-name { transform: none; }

  @media (max-width: 820px) {
    #terminal { width: 96vw; height: 92vh; }
    .term-body { font-size: 20px; padding: 22px; line-height: 1.85; }
    .term-header { padding: 10px 14px; }
    .term-title { font-size: 12px; margin-left: 6px; letter-spacing: .1em; }
    .term-meta { font-size: 13px; }
    .line-soup, .line-soup-key { font-size: 22px; }
    .block-cursor { width: 10px; height: 20px; }

    .enter-inner { gap: 22px; }
    .enter-pulse { width: 14px; height: 14px; }
    .cover-top { left: 6vw; top: 11vh; gap: 16px; }
    .cover-top img { height: 72px; }
    .club-name { font-size: 32px; letter-spacing: .2em; }
    .title-group { left: 6vw; right: 6vw; top: 51%; }
    .kicker { margin-bottom: 20px; }
    .subtitle-cn { padding-left: 16px; margin-top: 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .enter-inner { animation: none !important; opacity: 1 !important; }
    .enter-pulse { animation: none !important; }
    .char-span   { animation: none !important; opacity: 1 !important;
                   transform: none !important; filter: none !important; }
    .typing-cursor { animation: none !important; }
    .dot-jump > span { animation: none !important; opacity: 1 !important; }
  }
</style>
</head>
<body>

<div id="vanta-bg"></div>
<div id="flash"></div>

<div id="cover">
  <div class="cover-top" id="coverTop">
    <img src="./logo.png" alt="奇思科创社"
         onerror="this.style.display='none';document.getElementById('clubName').style.fontSize='64px';">
    <div class="club-name" id="clubName">奇思科创社</div>
  </div>

  <div class="title-group">
    <div class="kicker" id="kicker">Brain-Computer Interface</div>
    <div class="title" id="title" data-split="chars" data-delay="0.55" data-stagger="0.12">智启未来</div>
    <div class="subtitle-cn" id="subtitleCn">脑机接口科普讲座互动二  神秘海龟汤</div>
  </div>
</div>

<div id="terminal">
  <div class="term-header">
    <span class="dot red"></span>
    <span class="dot yellow"></span>
    <span class="dot green"></span>
    <span class="term-title">NEURO-LINK // LATERAL THINKING TERMINAL</span>
    <span class="term-meta" id="termMeta">PROBES 0 / 20</span>
  </div>
  <div class="term-body" id="termBody"></div>
</div>

<div id="enterOverlay">
  <div class="enter-inner">
    <span class="enter-pulse"></span>
    <span class="enter-text">Click to enter game2</span>
  </div>
</div>

<script src="./three.r134.min.js"></script>
<script src="./vanta.waves.min.js"></script>

<script>
(function () {
  'use strict';

  var CONFIG = {
    bgColor: 0x1a33,
    bgMouseControls: true,
    bgTouchControls: true,
    bgScale: 1.00,
    bgScaleMobile: 1.00,
    maxQuestions: 20,
    extraPerContinue: 20
  };

  var termBody = document.getElementById('termBody');
  var termMeta = document.getElementById('termMeta');
  var terminal = document.getElementById('terminal');
  var flash    = document.getElementById('flash');

  var state = {
    phase: 'loading',
    qCount: 0
  };

  var hintIndex = 0;
  var decodeToken = 0;

  var records = [];
  var pendingQuestion = '';

  var awaitLineEl = null;
  var awaitFrozen = false;
  var decodeLineEl = null;

  var ANSWERS = {
    '1': { text: '是',       cls: 'answer-yes' },
    '2': { text: '不是',     cls: 'answer-no' },
    '3': { text: '无关',     cls: 'answer-irrel' },
    '4': { text: '是也不是', cls: 'answer-both' },
    '5': { text: '无法回答', cls: 'answer-cannot' }
  };

  var DECODE_WORDS = [
    '编码中',
    '解码中',
    '信息传递中',
    '信号解析中',
    '语义解析中',
    '逻辑推理中',
    '回答生成中',
    '情节比对中'
  ];
  var lastDecodeIdx = -1;

  var HINTS = [
    '床头那个插线板，到底在给什么东西供电？',
    '哥哥四肢瘫痪，他是怎么"打字"发出消息的？',
    '妹妹为什么仅凭一条消息就能判断出不对劲？',
    '再仔细看一遍那条消息，写法上有没有什么不自然的地方？',
    '如果这条消息不是本人发的，那会是谁？他为什么要阻止妹妹断网？'
  ];

  var COMMAND_MAP = {
    'hint':     'hint',
    'h':        'hint',
    '提示':     'hint',
    'reveal':   'solution',
    'r':        'solution',
    'solution': 'solution',
    'sol':      'solution',
    'truth':    'solution',
    'answer':   'solution',
    's':        'solution',
    'a':        'solution',
    '真相':     'solution',
    '揭晓':     'solution',
    'all':      'all',
    'allq':     'all',
    'history':  'all',
    'list':     'all',
    'records':  'all',
    'log':      'all',
    '记录':     'all',
    '历史':     'all',
    '全部':     'all',
    '已问':     'all'
  };

  function parseCommand(raw) {
    if (!raw) return null;
    var compact = raw.replace(/\s+/g, '').toLowerCase();
    if (COMMAND_MAP[compact]) return COMMAND_MAP[compact];
    var m = /^print[\s:\.\-\(]*([a-z]+)\)?$/.exec(compact);
    if (m) return COMMAND_MAP[m[1]] || null;
    return null;
  }

  /* ===== 进入体验 + 封面动画 ===== */
  var entered = false;
  var triggered = false;
  var sceneToken = 0;
  var PREFERS_REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function enterFullscreen() {
    var el = document.documentElement;
    var fn = el.requestFullscreen
          || el.webkitRequestFullscreen
          || el.msRequestFullscreen;
    if (!fn) return;
    try {
      var r = fn.call(el);
      if (r && typeof r.catch === 'function') r.catch(function () {});
    } catch (e) {}
  }

  function enterExperience() {
    if (entered) return;
    entered = true;
    enterFullscreen();
    document.getElementById('enterOverlay').classList.add('hidden');
    document.getElementById('cover').classList.add('ready');
    startCoverAnimation();
  }

  function startCoverAnimation() {
    typewrite(
      document.getElementById('kicker'),
      'Brain-Computer Interface',
      { speed: 52, leadDelay: 0.2, cursorHold: 700 }
    );

    var splitEls = document.querySelectorAll('[data-split="chars"]');
    for (var i = 0; i < splitEls.length; i++) splitChars(splitEls[i]);

    condenseChars(document.getElementById('subtitleCn'), {
      leadDelay: 1.9,
      stagger: 0.04,
      duration: 780
    });
  }

  function splitChars(el) {
    var delay = parseFloat(el.dataset.delay || 0);
    var stagger = parseFloat(el.dataset.stagger || 0.04);
    var text = el.textContent;
    el.textContent = '';
    el.style.letterSpacing = '0';
    var ci = 0;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var span = document.createElement('span');
      span.className = 'char-span';
      span.textContent = (ch === ' ') ? '\u00A0' : ch;
      span.style.animationDelay = (delay + ci * stagger).toFixed(3) + 's';
      el.appendChild(span);
      if (ch !== ' ') ci++;
    }
  }

  function typewrite(el, text, opt) {
    opt = opt || {};
    var speed      = opt.speed      != null ? opt.speed      : 52;
    var leadDelay  = (opt.leadDelay != null ? opt.leadDelay  : 0)     * 1000;
    var cursorHold = opt.cursorHold != null ? opt.cursorHold : 700;

    el.textContent = '';
    el.setAttribute('aria-label', text);

    var cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    cursor.setAttribute('aria-hidden', 'true');
    el.appendChild(cursor);

    var i = 0;
    function tick() {
      if (i >= text.length) {
        setTimeout(function () {
          cursor.classList.add('fade');
          setTimeout(function () {
            if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
          }, 520);
        }, cursorHold);
        return;
      }
      var ch = text[i];
      cursor.insertAdjacentText('beforebegin', ch);
      i++;
      var next = speed;
      if (ch === ' ') next = speed * 0.4;
      else if (ch === '-') next = speed * 1.4;
      setTimeout(tick, next);
    }
    setTimeout(tick, leadDelay);
  }

  function condenseChars(el, opt) {
    opt = opt || {};
    var stagger   = (opt.stagger   != null ? opt.stagger   : 0.035) * 1000;
    var duration  =  opt.duration  != null ? opt.duration  : 780;
    var leadDelay = (opt.leadDelay != null ? opt.leadDelay : 0)     * 1000;

    var text = el.textContent;
    el.setAttribute('aria-label', text);
    el.textContent = '';
    el.style.letterSpacing = '0';

    var spans = [];
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var s = document.createElement('span');
      s.className = 'condense-span';
      s.setAttribute('aria-hidden', 'true');
      s.textContent = (ch === ' ') ? '\u00A0' : ch;

      s.style.transform = 'translateY(130%)';
      s.style.opacity   = '0';
      s.style.filter    = 'blur(6px)';
      s.style.willChange = 'transform, opacity, filter';

      el.appendChild(s);
      spans.push(s);
    }

    if (PREFERS_REDUCED) {
      for (var r = 0; r < spans.length; r++) {
        spans[r].style.transform = 'none';
        spans[r].style.filter    = 'none';
        spans[r].style.opacity   = '1';
        spans[r].style.removeProperty('will-change');
      }
      return;
    }

    var t0 = performance.now();
    var total = leadDelay + spans.length * stagger + duration;

    function frame(now) {
      var elapsed = now - t0;
      for (var k = 0; k < spans.length; k++) {
        var local = elapsed - (leadDelay + k * stagger);
        if (local <= 0) continue;
        var p = Math.min(local / duration, 1);
        var e = 1 - Math.pow(1 - p, 4);
        var y    = (1 - e) * 130;
        var blur = (1 - e) * 6;
        spans[k].style.transform = 'translateY(' + y + '%)';
        spans[k].style.opacity   = e;
        spans[k].style.filter    = 'blur(' + blur + 'px)';
      }
      if (elapsed < total) {
        requestAnimationFrame(frame);
      } else {
        for (var m = 0; m < spans.length; m++) {
          spans[m].style.removeProperty('will-change');
          spans[m].style.transform = 'none';
          spans[m].style.filter    = 'none';
          spans[m].style.opacity   = '1';
        }
      }
    }
    requestAnimationFrame(frame);
  }

  function startScene() {
    if (triggered) return;
    triggered = true;
    var tk = ++sceneToken;

    document.getElementById('coverTop').classList.add('split-up');
    document.getElementById('kicker').classList.add('split-up');
    document.getElementById('title').classList.add('split-left');
    document.getElementById('subtitleCn').classList.add('split-right');
    document.getElementById('cover').classList.add('done');

    setTimeout(function () {
      if (tk !== sceneToken) return;
      terminal.classList.add('show');
    }, 650);

    setTimeout(function () {
      if (tk !== sceneToken) return;
      state.qCount = 0;
      hintIndex = 0;
      records = [];
      pendingQuestion = '';
      decodeToken++;
      CONFIG.maxQuestions = 20;
      updateMeta();
      boot();
    }, 1900);
  }

  function backToCover() {
    if (!triggered) return;
    triggered = false;
    sceneToken++;

    decodeToken++;
    state.phase = 'idle';
    records = [];
    pendingQuestion = '';
    removeInputLine();
    removeAwaitLine();
    removeDecodeLine();

    terminal.classList.remove('show');

    setTimeout(function () {
      document.getElementById('coverTop').classList.remove('split-up');
      document.getElementById('kicker').classList.remove('split-up');
      document.getElementById('title').classList.remove('split-left');
      document.getElementById('subtitleCn').classList.remove('split-right');
      document.getElementById('cover').classList.remove('done');
    }, 500);
  }

  /* ===== 背景 ===== */
  window.addEventListener('DOMContentLoaded', function () {
    if (typeof VANTA !== 'undefined' && VANTA.WAVES) {
      VANTA.WAVES({
        el: "#vanta-bg",
        mouseControls: CONFIG.bgMouseControls,
        touchControls: CONFIG.bgTouchControls,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: CONFIG.bgScale,
        scaleMobile: CONFIG.bgScaleMobile,
        color: CONFIG.bgColor
      });
    }
  });

  /* ===== 工具 ===== */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function scrollBottom() { termBody.scrollTop = termBody.scrollHeight; }

  var inputLineEl = null;
  var qInput = null;
  var composing = false;

  function insertBeforeInput(el) {
    if (inputLineEl && inputLineEl.parentNode === termBody) {
      termBody.insertBefore(el, inputLineEl);
    } else {
      termBody.appendChild(el);
    }
    scrollBottom();
  }

  function appendLine(text, className) {
    var el = document.createElement('div');
    el.textContent = text || '';
    if (className) el.className = className;
    insertBeforeInput(el);
    return el;
  }

  async function typeLine(text, speed, className) {
    var el = appendLine('', className);
    for (var i = 0; i < text.length; i++) {
      el.textContent += text[i];
      scrollBottom();
      await sleep(speed);
    }
    return el;
  }

  async function printLines(lines, speed, className) {
    for (var i = 0; i < lines.length; i++) {
      await typeLine(lines[i], speed, className);
      await sleep(70);
    }
  }

  function updateMeta() {
    termMeta.textContent = 'PROBES ' + state.qCount + ' / ' + CONFIG.maxQuestions;
  }

  /* ============================================================
     等待输入行
     ============================================================ */
  function addAwaitLine() {
    if (awaitLineEl) return;
    awaitFrozen = false;

    var el = appendLine('', 'line-prompt');
    awaitLineEl = el;

    var text = '> 等待输入中';
    var i = 0;
    var lastTime = 0;

    function tick(now) {
      if (awaitFrozen) return;
      if (!lastTime) lastTime = now;

      if (i < text.length && now - lastTime >= 24) {
        el.textContent += text[i];
        i++;
        lastTime = now;
        scrollBottom();
      }

      if (i >= text.length) {
        if (awaitFrozen) return;
        var wrap = document.createElement('span');
        wrap.className = 'dot-jump';
        wrap.setAttribute('aria-hidden', 'true');
        for (var k = 0; k < 3; k++) {
          var s = document.createElement('span');
          s.textContent = '.';
          wrap.appendChild(s);
        }
        el.appendChild(wrap);
        scrollBottom();
        return;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function removeAwaitLine() {
    awaitFrozen = true;
    if (awaitLineEl && awaitLineEl.parentNode) {
      awaitLineEl.parentNode.removeChild(awaitLineEl);
    }
    awaitLineEl = null;
  }

  function removeDecodeLine() {
    if (decodeLineEl && decodeLineEl.parentNode) {
      decodeLineEl.parentNode.removeChild(decodeLineEl);
    }
    decodeLineEl = null;
  }

  function setPhase(p) {
    state.phase = p;
    if (p === 'question') {
      addAwaitLine();
      createInputLine();
    } else if (p === 'awaiting_continue') {
      createInputLine();
    }
  }

  /* ===== 输入行 ===== */
  function createInputLine() {
    if (inputLineEl) return;

    inputLineEl = document.createElement('div');
    inputLineEl.className = 'line-input-line';

    var prefix = document.createElement('span');
    prefix.className = 'input-prefix';
    prefix.textContent = '>>> ';

    qInput = document.createElement('span');
    qInput.className = 'inline-input';
    qInput.setAttribute('contenteditable', 'true');
    qInput.setAttribute('spellcheck', 'false');
    qInput.addEventListener('keydown', onInputKey);
    qInput.addEventListener('paste', onInputPaste);
    qInput.addEventListener('input', onInputChange);
    qInput.addEventListener('compositionstart', function () { composing = true; });
    qInput.addEventListener('compositionend', function () { composing = false; });

    var cur = document.createElement('span');
    cur.className = 'block-cursor';

    inputLineEl.appendChild(prefix);
    inputLineEl.appendChild(qInput);
    inputLineEl.appendChild(cur);

    inputLineEl.addEventListener('click', function () {
      if (state.phase !== 'question' && state.phase !== 'awaiting_continue') return;
      try { qInput.focus(); } catch (e) {}
      moveCaretToEnd();
    });

    termBody.appendChild(inputLineEl);
    scrollBottom();

    setTimeout(function () {
      try { qInput.focus(); } catch (e) {}
      moveCaretToEnd();
    }, 60);
  }

  function moveCaretToEnd() {
    if (!qInput) return;
    try {
      var range = document.createRange();
      var sel = window.getSelection();
      range.selectNodeContents(qInput);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) {}
  }

  function onInputKey(e) {
    if (e.key === 'Enter' && !composing) {
      e.preventDefault();
      if (!qInput) return;
      var v = (qInput.textContent || '').trim();
      if (v) submitQuestion();
      return;
    }
  }

  function onInputPaste(e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
    text = text.replace(/[\r\n]+/g, ' ');
    try { document.execCommand('insertText', false, text); } catch (err) {}
  }

  function onInputChange() {
    if (!qInput) return;
    var t = qInput.textContent || '';
    var limit = state.phase === 'awaiting_continue' ? 8 : 80;
    if (t.length > limit) {
      qInput.textContent = t.slice(0, limit);
      moveCaretToEnd();
    }
  }

  function finalizeInputLine() {
    if (!inputLineEl || !qInput) return '';
    var val = (qInput.textContent || '').trim();

    qInput.setAttribute('contenteditable', 'false');
    qInput.classList.add('locked');

    var cur = inputLineEl.querySelector('.block-cursor');
    if (cur) {
      cur.classList.add('fading');
      setTimeout(function () {
        if (cur.parentNode) cur.parentNode.removeChild(cur);
      }, 350);
    }

    inputLineEl = null;
    qInput = null;
    scrollBottom();
    return val;
  }

  function removeInputLine() {
    if (inputLineEl && inputLineEl.parentNode) {
      inputLineEl.parentNode.removeChild(inputLineEl);
    }
    inputLineEl = null;
    qInput = null;
  }

  /* ============================================================
     开场：加载日志 → 解码汤面（持续跳动）→ 汤面 → 规则 → 输出完毕
     ============================================================ */
  async function boot() {
    state.phase = 'loading';
    termBody.innerHTML = '';
    updateMeta();

    await sleep(400);
    await typeLine('[ OK ] neural-interface v2.0 loaded', 9, 'line-log');
    await sleep(120);
    await typeLine('[ OK ] lateral-thinking module online', 9, 'line-log');
    await sleep(120);
    await typeLine('[ OK ] semantic-decoder ready', 9, 'line-log');
    await sleep(120);
    await typeLine('[ OK ] truth-verification channel open', 9, 'line-log');
    await sleep(500);

    appendLine('', 'line-info');

    /* —— 解码汤面标题行：文字打字 + 持续跳动点 —— */
    var headerEl = appendLine('', 'line-prompt');
    var headerText = '> 正在解码汤面';
    for (var h = 0; h < headerText.length; h++) {
      headerEl.textContent += headerText[h];
      scrollBottom();
      await sleep(30);
    }
    var headerDots = document.createElement('span');
    headerDots.className = 'dot-jump';
    headerDots.setAttribute('aria-hidden', 'true');
    for (var d = 0; d < 3; d++) {
      var dspan = document.createElement('span');
      dspan.textContent = '.';
      headerDots.appendChild(dspan);
    }
    headerEl.appendChild(headerDots);
    scrollBottom();

    await sleep(700);
    appendLine('', 'line-info');

    /* —— 汤面 —— */
    await typeLine('哥哥因脊髓损伤四肢瘫痪，但呼吸心跳正常。', 32, 'line-soup');
    await sleep(180);
    await typeLine('某天，他给妹妹发来一条消息：', 32, 'line-soup');
    await sleep(240);
    appendLine('', 'line-info');
    await typeLine('「阿妹，我床头的那个插头先别拔，我晚上还要用。」', 36, 'line-soup-key');
    await sleep(320);
    appendLine('', 'line-info');
    await typeLine('妹妹看到后，立刻拔掉了插线板电源。', 32, 'line-soup');
    await sleep(450);
    appendLine('', 'line-info');

    /* —— 提问规则 —— */
    await typeLine('> 提问规则', 26, 'line-prompt');
    await sleep(150);
    await printLines([
      '  1. 只能问是非题',
      '  2. 系统只回答五种：是 / 不是 / 无关 / 是也不是 / 无法回答',
      '  3. 不能直接猜汤底，必须通过提问逐步推出完整真相',
      '  4. 最多提问 ' + CONFIG.maxQuestions + ' 次',
      '  5. 输入 all 可查看已问过的所有问题与回答'
    ], 15, 'line-info');

    /* —— 规则输出完毕，停止跳动，标题行原地变为"输出完毕" —— */
    await sleep(400);
    if (headerDots.parentNode) headerDots.parentNode.removeChild(headerDots);
    headerEl.textContent = '> 输出完毕';
    headerEl.className = 'line-success';
    scrollBottom();

    await sleep(350);
    appendLine('', 'line-info');
    setPhase('question');
  }

  /* ===== 提交 ===== */
  async function submitQuestion() {
    if (!qInput) return;

    var raw = (qInput.textContent || '').trim();
    if (!raw) return;

    /* —— awaiting_continue 分支：只接受 YES/Y/NO/N —— */
    if (state.phase === 'awaiting_continue') {
      finalizeInputLine();
      var ans = raw.toUpperCase().replace(/\s+/g, '');

      if (ans === 'YES' || ans === 'Y') {
        CONFIG.maxQuestions += CONFIG.extraPerContinue;
        updateMeta();
        appendLine('', 'line-info');
        await typeLine('> 继续提问', 22, 'line-info');
        appendLine('', 'line-info');
        await sleep(280);
        setPhase('question');
        return;
      }

      if (ans === 'NO' || ans === 'N') {
        appendLine('', 'line-info');
        await sleep(200);
        reveal();
        return;
      }

      await typeLine('  ⚠ 请输入 YES 或 NO', 20, 'line-error');
      await sleep(300);
      appendLine('', 'line-info');
      setPhase('awaiting_continue');
      return;
    }

    /* —— question 分支 —— */
    if (state.phase !== 'question') return;

    var cmd = parseCommand(raw);
    removeAwaitLine();
    finalizeInputLine();

    if (cmd) {
      await runCommand(cmd);
      return;
    }

    pendingQuestion = raw;
    state.qCount++;
    updateMeta();
    state.phase = 'answer';
    startDecoding();
  }

  /* ===== 执行内置命令 ===== */
  async function runCommand(kind) {
    if (kind === 'hint') {
      await sleep(160);
      await showHint();
      if (state.phase === 'question') setPhase('question');
      return;
    }
    if (kind === 'solution') {
      await sleep(160);
      await reveal();
      return;
    }
    if (kind === 'all') {
      await sleep(160);
      await showAllRecords();
      if (state.phase === 'question') setPhase('question');
      return;
    }
  }

  /* ===== 解码动画 ===== */
  function pickDecodeWord() {
    var idx;
    var n = DECODE_WORDS.length;
    if (n === 1) return DECODE_WORDS[0];
    do {
      idx = Math.floor(Math.random() * n);
    } while (idx === lastDecodeIdx);
    lastDecodeIdx = idx;
    return DECODE_WORDS[idx];
  }

  async function startDecoding() {
    var token = ++decodeToken;
    var word = pickDecodeWord();
    var el = appendLine('  ' + word + ' ', 'line-info');
    decodeLineEl = el;
    var frames = ['   ', '.  ', '.. ', '...'];
    var k = 0;

    while (token === decodeToken) {
      el.textContent = '  ' + word + frames[k % 4];
      scrollBottom();
      k++;
      await sleep(150);
    }
  }

  /* ===== 判定 ===== */
  async function recordAnswer(num) {
    if (state.phase !== 'answer') return;
    var a = ANSWERS[String(num)];
    if (!a) return;

    if (pendingQuestion) {
      records.push({ q: pendingQuestion, a: a.text, cls: a.cls });
      pendingQuestion = '';
    }

    state.phase = 'busy';
    decodeToken++;
    await sleep(120);

    removeDecodeLine();

    var el = appendLine('', 'line-a-record');
    var prefix = '  判定结果：';
    for (var i = 0; i < prefix.length; i++) {
      el.textContent += prefix[i];
      scrollBottom();
      await sleep(35);
    }
    var tag = document.createElement('span');
    tag.className = a.cls;
    tag.textContent = a.text;
    el.appendChild(tag);
    scrollBottom();

    await sleep(600);
    appendLine('', 'line-info');

    if (state.qCount >= CONFIG.maxQuestions) {
      await askContinue();
    } else {
      setPhase('question');
    }
  }

  /* ===== 询问是否继续 ===== */
  async function askContinue() {
    await sleep(220);
    await typeLine('> 提问次数已用完，是否继续尝试？', 26, 'line-ask');
    await sleep(220);
    appendLine('', 'line-info');
    setPhase('awaiting_continue');
  }

  /* ===== 提示 ===== */
  async function showHint() {
    if (hintIndex >= HINTS.length) {
      await typeLine('  [提示] 已无更多提示', 22, 'line-hint');
      appendLine('', 'line-info');
      return;
    }
    var h = HINTS[hintIndex];
    hintIndex++;
    await typeLine('  [提示] ' + h, 22, 'line-hint');
    appendLine('', 'line-info');
  }

  /* ===== 全部记录 ===== */
  async function showAllRecords() {
    var token = decodeToken;
    appendLine('', 'line-info');

    if (records.length === 0) {
      await typeLine('  [记录] 暂无问答记录', 22, 'line-hint');
      appendLine('', 'line-info');
      return;
    }

    await typeLine('  [记录] 共 ' + records.length + ' 条问答：', 22, 'line-hint');
    await sleep(140);

    for (var i = 0; i < records.length; i++) {
      if (token !== decodeToken) return;

      var r = records[i];
      var el = appendLine('', 'line-q-record');
      el.textContent = '  Q' + (i + 1) + '. ' + r.q + '  →  ';
      var tag = document.createElement('span');
      tag.className = r.cls;
      tag.textContent = r.a;
      el.appendChild(tag);
      scrollBottom();

      await sleep(70);
    }

    appendLine('', 'line-info');
  }

  /* ===== 揭晓 ===== */
  async function reveal() {
    if (state.phase === 'revealed') return;
    decodeToken++;
    removeInputLine();
    removeAwaitLine();
    removeDecodeLine();
    state.phase = 'revealed';

    flash.classList.add('on');
    await sleep(220);
    flash.classList.remove('on');
    await sleep(450);

    appendLine('', 'line-info');
    await typeLine('════════════════════════════════════', 3, 'line-success');
    await typeLine('          真  相  解  码', 45, 'line-success');
    await typeLine('════════════════════════════════════', 3, 'line-success');
    await sleep(600);
    appendLine('', 'line-info');

    var lines = [
      { t: '哥哥靠联网脑机接口用意念打字交流。',            c: 'line-explain' },
      { t: '他的脑机接口被黑客入侵了。',                    c: 'line-explain' },
      { t: '',                                              c: 'line-info' },
      { t: '黑客想阻止妹妹断网，于是模拟哥哥的脑信号，',      c: 'line-explain' },
      { t: '借他的设备发出消息：',                          c: 'line-explain' },
      { t: '',                                              c: 'line-info' },
      { t: '「阿妹，我床头的那个插头先别拔，我晚上还要用。」', c: 'line-soup-key' },
      { t: '',                                              c: 'line-info' },
      { t: '那个插线板给家里的路由器供电，拔掉就会断网。',    c: 'line-explain' },
      { t: '黑客怕断网，所以冒充哥哥阻止妹妹。',              c: 'line-explain' },
      { t: '',                                              c: 'line-info' },
      { t: '但黑客不知道：哥哥是年轻人，平时打字从不打句号。', c: 'line-explain' },
      { t: '妹妹看到消息末尾居然有一个句号，立刻意识到',      c: 'line-explain' },
      { t: '这很可能不是哥哥本人发的，而是有人借他的设备在说话。', c: 'line-answer' },
      { t: '',                                              c: 'line-info' },
      { t: '于是她拔掉插线板电源，切断网络，',                c: 'line-explain' },
      { t: '也切断了黑客的入侵链路。',                        c: 'line-explain' },
      { t: '',                                              c: 'line-info' },
      { t: '拔电源不会危及哥哥生命，',                        c: 'line-explain' },
      { t: '只会让他暂时失去脑机接口的交流能力。',            c: 'line-explain' }
    ];

    for (var i = 0; i < lines.length; i++) {
      await typeLine(lines[i].t, 20, lines[i].c);
      await sleep(90);
    }

    await sleep(500);
    appendLine('', 'line-info');
    await typeLine('> 科普点', 26, 'line-prompt');
    await sleep(200);
    await printLines([
      '· 脑机接口让瘫痪患者用意念重新恢复交流能力',
      '· 联网设备的安全风险：脑机接口同样可能被入侵',
      '· 身份验证：如何确认"这条信号真的来自本人"',
      '· 断网不等于断命：脑机接口的供电与安全设计'
    ], 17, 'line-info');
  }

  /* ===== 全局键盘 ===== */
  window.addEventListener('keydown', function (e) {

    if (!entered) {
      if (e.code === 'Space') {
        e.preventDefault();
        enterExperience();
      }
      return;
    }

    if (!triggered) {
      if (e.code === 'Space') {
        e.preventDefault();
        startScene();
      }
      return;
    }

    if (e.key === 'ArrowUp' && state.phase !== 'loading') {
      e.preventDefault();
      backToCover();
      return;
    }

    if ((e.key === 'f' || e.key === 'F') && state.phase !== 'question' && state.phase !== 'awaiting_continue') {
      e.preventDefault();
      toggleFullscreen();
      return;
    }

    if (state.phase === 'answer') {
      if (e.key >= '1' && e.key <= '5') {
        e.preventDefault();
        recordAnswer(e.key);
      }
      return;
    }
  });

  terminal.addEventListener('click', function () {
    if ((state.phase === 'question' || state.phase === 'awaiting_continue') && qInput) {
      try { qInput.focus(); } catch (e) {}
      moveCaretToEnd();
    }
  });

  function toggleFullscreen() {
    var el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (fn) { try { fn.call(el); } catch (err) {} }
    } else {
      var fx = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (fx) { try { fx.call(document); } catch (err) {} }
    }
  }

  window.addEventListener('DOMContentLoaded', function () {
    var overlay = document.getElementById('enterOverlay');
    if (overlay) {
      overlay.addEventListener('click', enterExperience);
      overlay.addEventListener('touchstart', enterExperience, { passive: true });
    }
  });

  window.addEventListener('wheel', function (e) {
    if (!entered) { enterExperience(); return; }
    if (!triggered && e.deltaY > 0) startScene();
  }, { passive: true });

  var touchStartY = 0;
  window.addEventListener('touchstart', function (e) {
    if (!entered) { enterExperience(); return; }
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (!entered || triggered) return;
    var dy = touchStartY - e.touches[0].clientY;
    if (dy > 40) startScene();
  }, { passive: true });

})();
</script>
