<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智启未来 · 脑机接口科普讲座 · 海龟汤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0e1a;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    color: #eaf7ff;
    user-select: none; -webkit-user-select: none;
  }

  #vanta-bg { position: fixed; inset: 0; z-index: 0; }

  #terminal {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    width: min(92vw, 1360px);
    height: min(88vh, 940px);
    background: rgba(6, 12, 24, 0.92);
    border: 1px solid rgba(90, 142, 200, 0.4);
    border-radius: 10px;
    box-shadow:
      0 0 90px rgba(40, 90, 150, 0.28),
      0 0 0 1px rgba(90,142,200,.08),
      inset 0 0 70px rgba(30, 70, 120, 0.08);
    font-family: "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(8px);
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  #terminal.show { opacity: 1; }

  .term-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 24px;
    background: rgba(10, 20, 36, 0.75);
    border-bottom: 1px solid rgba(90, 142, 200, 0.22);
    flex-shrink: 0;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .dot.red    { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green  { background: #27c93f; }
  .term-title {
    margin-left: 14px;
    font-size: 15px;
    letter-spacing: .18em;
    color: rgba(140, 180, 220, 0.72);
  }
  .term-meta {
    margin-left: auto;
    font-size: 14px;
    letter-spacing: .12em;
    color: rgba(120, 170, 220, 0.6);
  }

  .term-body {
    flex: 1;
    padding: 30px 42px 28px;
    overflow-y: auto;
    font-size: 20px;
    line-height: 1.9;
    color: #b8d4f0;
    scroll-behavior: smooth;
  }
  .term-body::-webkit-scrollbar { width: 7px; }
  .term-body::-webkit-scrollbar-thumb {
    background: rgba(90,142,200,.3);
    border-radius: 3px;
  }

  .term-body > div {
    white-space: pre-wrap;
    word-break: break-word;
  }

  .line-log     { color: rgba(120, 160, 200, 0.5); }
  .line-prompt  { color: rgba(150, 190, 230, 0.78); }
  .line-info    { color: rgba(150, 190, 230, 0.6); }
  .line-success { color: #6fe8a8; margin-top: 8px; }
  .line-error   { color: #ff8a9e; margin-top: 8px; }
  .line-answer  { color: #ffd479; }
  .line-explain { color: rgba(190, 218, 240, 0.82); }

  .line-soup {
    color: #d8ecff;
    font-size: 22px;
    line-height: 2.05;
    margin: 4px 0;
  }
  .line-soup-key {
    color: #ffd479;
    font-size: 22px;
    line-height: 2.05;
    font-weight: 600;
    margin: 4px 0;
    text-shadow: 0 0 18px rgba(255, 212, 121, 0.25);
  }

  .line-q-record { color: rgba(210, 232, 250, 0.92); margin-top: 14px; }
  .line-a-record { margin-top: 2px; color: rgba(180, 210, 235, 0.75); }

  .answer-yes    { color: #6fe8a8; font-weight: 700; letter-spacing: .06em; }
  .answer-no     { color: #ff8a9e; font-weight: 700; letter-spacing: .06em; }
  .answer-irrel  { color: #8899aa; font-weight: 700; letter-spacing: .06em; }
  .answer-both   { color: #ffd479; font-weight: 700; letter-spacing: .06em; }
  .answer-cannot { color: #7ec8e8; font-weight: 700; letter-spacing: .06em; }

  .line-hint { color: #c4a8ff; }

  .line-input-line {
    display: flex;
    align-items: center;
    margin-top: 14px;
    white-space: pre;
    cursor: text;
  }
  .input-prefix {
    color: #6fa8dc;
    flex-shrink: 0;
    white-space: pre;
  }
  .inline-input {
    flex: 0 1 auto;
    min-width: 4px;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    color: #eaf7ff;
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    letter-spacing: inherit;
    caret-color: transparent;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    user-select: text; -webkit-user-select: text;
    transition: color .35s ease;
  }
  .inline-input.locked {
    color: rgba(210, 232, 250, 0.92);
    pointer-events: none;
  }

  .block-cursor {
    display: inline-block;
    width: 11px;
    height: 22px;
    background: #7ec8e8;
    margin-left: 3px;
    flex-shrink: 0;
    box-shadow: 0 0 8px rgba(126, 200, 232, 0.6);
    animation: blink .75s steps(1) infinite;
    transition: opacity .3s ease;
  }
  .block-cursor.fading { opacity: 0; animation: none; }
  @keyframes blink { 50% { opacity: 0; } }

  #flash {
    position: fixed; inset: 0;
    background: #cfe8ff;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity .45s ease;
  }
  #flash.on { opacity: .35; }

  @media (max-width: 820px) {
    #terminal { width: 96vw; height: 92vh; }
    .term-body { font-size: 15px; padding: 16px 18px 20px; line-height: 1.8; }
    .term-header { padding: 10px 14px; }
    .term-title { font-size: 11px; margin-left: 6px; letter-spacing: .1em; }
    .term-meta { font-size: 12px; }
    .line-soup, .line-soup-key { font-size: 16px; }
    .block-cursor { width: 9px; height: 17px; }
  }
</style>
</head>
<body>

<div id="vanta-bg"></div>
<div id="flash"></div>

<div id="terminal" class="show">
  <div class="term-header">
    <span class="dot red"></span>
    <span class="dot yellow"></span>
    <span class="dot green"></span>
    <span class="term-title">NEURO-LINK // LATERAL THINKING TERMINAL</span>
    <span class="term-meta" id="termMeta">Q 0 / 20</span>
  </div>
  <div class="term-body" id="termBody"></div>
</div>

<script src="./three.min.js"></script>
<script src="./vanta.fog.min.js"></script>

<script>
(function () {
  'use strict';

  var CONFIG = {
    bgMouseControls: true,
    bgTouchControls: true,
    bgGyroControls: false,
    bgScale: 1.0,
    bgScaleMobile: 1.0,
    bgBaseColor: 0x0a1830,
    bgLowlightColor: 0x040812,
    bgMidtoneColor: 0x1a3a6a,
    bgHighlightColor: 0x5a8ec8,
    bgBlurFactor: 0.6,
    bgSpeed: 1.2,
    bgZoom: 1.0,

    maxQuestions: 20
  };

  var termBody = document.getElementById('termBody');
  var termMeta = document.getElementById('termMeta');
  var terminal = document.getElementById('terminal');
  var flash    = document.getElementById('flash');

  var state = {
    phase: 'loading',
    qCount: 0
  };

  var hintIndex = 0;
  var decodeToken = 0;

  var ANSWERS = {
    '1': { text: '是',       cls: 'answer-yes' },
    '2': { text: '不是',     cls: 'answer-no' },
    '3': { text: '无关',     cls: 'answer-irrel' },
    '4': { text: '是也不是', cls: 'answer-both' },
    '5': { text: '无法回答', cls: 'answer-cannot' }
  };

  var DECODE_WORDS = [
    '编码中',
    '解码中',
    '信息传递中',
    '信号解析中',
    '语义解析中',
    '意图识别中',
    '神经匹配中',
    '知识检索中',
    '逻辑推理中',
    '答案生成中',
    '皮层分析中',
    '脉冲比对中'
  ];
  var lastDecodeIdx = -1;

  var HINTS = [
    '床头那个插线板，到底在给什么东西供电？',
    '哥哥四肢瘫痪，他是怎么"打字"发出消息的？',
    '妹妹为什么仅凭一条消息就能判断出不对劲？',
    '再仔细看一遍那条消息，写法上有没有什么不自然的地方？',
    '如果这条消息不是本人发的，那会是谁？他为什么要阻止妹妹断网？'
  ];

  /* ============================================================
     🎛️ 终端内置命令
     ------------------------------------------------------------
       主持人可直接在输入框中输入短命令：
         hint      → 输出下一条提示
         reveal    → 输出完整汤底真相
       兼容写法（不区分大小写、允许空格/点/横线/括号）：
         hint / h / 提示
         reveal / r / solution / truth / answer / sol / 真相 / 揭晓
       旧写法也保留：
         print:hint / print:solution / print(hint) / print hint ...
     ============================================================ */
  var COMMAND_MAP = {
    'hint':     'hint',
    'h':        'hint',
    '提示':     'hint',
    'reveal':   'solution',
    'r':        'solution',
    'solution': 'solution',
    'sol':      'solution',
    'truth':    'solution',
    'answer':   'solution',
    's':        'solution',
    'a':        'solution',
    '真相':     'solution',
    '揭晓':     'solution'
  };

  function parseCommand(raw) {
    if (!raw) return null;
    var compact = raw.replace(/\s+/g, '').toLowerCase();

    /* 直接短命令 */
    if (COMMAND_MAP[compact]) return COMMAND_MAP[compact];

    /* 兼容旧写法：print:hint / print(hint) / print-hint / print.hint */
    var m = /^print[\s:\.\-\(]*([a-z]+)\)?$/.exec(compact);
    if (m) return COMMAND_MAP[m[1]] || null;

    return null;
  }

  /* ===== Vanta FOG 背景 ===== */
  window.addEventListener('DOMContentLoaded', function () {
    if (typeof VANTA !== 'undefined' && VANTA.FOG) {
      VANTA.FOG({
        el: '#vanta-bg',
        mouseControls: CONFIG.bgMouseControls,
        touchControls: CONFIG.bgTouchControls,
        gyroControls: CONFIG.bgGyroControls,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: CONFIG.bgScale,
        scaleMobile: CONFIG.bgScaleMobile,
        baseColor: CONFIG.bgBaseColor,
        lowlightColor: CONFIG.bgLowlightColor,
        midtoneColor: CONFIG.bgMidtoneColor,
        highlightColor: CONFIG.bgHighlightColor,
        blurFactor: CONFIG.bgBlurFactor,
        speed: CONFIG.bgSpeed,
        zoom: CONFIG.bgZoom
      });
    }
  });

  /* ===== 工具 ===== */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function scrollBottom() { termBody.scrollTop = termBody.scrollHeight; }

  var inputLineEl = null;
  var qInput = null;
  var composing = false;

  function insertBeforeInput(el) {
    if (inputLineEl && inputLineEl.parentNode === termBody) {
      termBody.insertBefore(el, inputLineEl);
    } else {
      termBody.appendChild(el);
    }
    scrollBottom();
  }

  function appendLine(text, className) {
    var el = document.createElement('div');
    el.textContent = text || '';
    if (className) el.className = className;
    insertBeforeInput(el);
    return el;
  }

  async function typeLine(text, speed, className) {
    var el = appendLine('', className);
    for (var i = 0; i < text.length; i++) {
      el.textContent += text[i];
      scrollBottom();
      await sleep(speed);
    }
    return el;
  }

  async function printLines(lines, speed, className) {
    for (var i = 0; i < lines.length; i++) {
      await typeLine(lines[i], speed, className);
      await sleep(70);
    }
  }

  function updateMeta() {
    termMeta.textContent = 'Q ' + state.qCount + ' / ' + CONFIG.maxQuestions;
  }

  function setPhase(p) {
    state.phase = p;
    if (p === 'question') createInputLine();
  }

  /* ===== 输入行 ===== */
  function createInputLine() {
    if (inputLineEl) return;

    inputLineEl = document.createElement('div');
    inputLineEl.className = 'line-input-line';

    var prefix = document.createElement('span');
    prefix.className = 'input-prefix';
    prefix.textContent = '>>> ';

    qInput = document.createElement('span');
    qInput.className = 'inline-input';
    qInput.setAttribute('contenteditable', 'true');
    qInput.setAttribute('spellcheck', 'false');
    qInput.addEventListener('keydown', onInputKey);
    qInput.addEventListener('paste', onInputPaste);
    qInput.addEventListener('input', onInputChange);
    qInput.addEventListener('compositionstart', function () { composing = true; });
    qInput.addEventListener('compositionend', function () { composing = false; });

    var cur = document.createElement('span');
    cur.className = 'block-cursor';

    inputLineEl.appendChild(prefix);
    inputLineEl.appendChild(qInput);
    inputLineEl.appendChild(cur);

    inputLineEl.addEventListener('click', function () {
      if (state.phase !== 'question') return;
      try { qInput.focus(); } catch (e) {}
      moveCaretToEnd();
    });

    termBody.appendChild(inputLineEl);
    scrollBottom();

    setTimeout(function () {
      try { qInput.focus(); } catch (e) {}
      moveCaretToEnd();
    }, 60);
  }

  function moveCaretToEnd() {
    if (!qInput) return;
    try {
      var range = document.createRange();
      var sel = window.getSelection();
      range.selectNodeContents(qInput);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) {}
  }

  function onInputKey(e) {
    if (e.key === 'Enter' && !composing) {
      e.preventDefault();
      if (!qInput) return;
      var v = (qInput.textContent || '').trim();
      if (v) submitQuestion();
      return;
    }
  }

  function onInputPaste(e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
    text = text.replace(/[\r\n]+/g, ' ');
    try { document.execCommand('insertText', false, text); } catch (err) {}
  }

  function onInputChange() {
    if (!qInput) return;
    var t = qInput.textContent || '';
    if (t.length > 80) {
      qInput.textContent = t.slice(0, 80);
      moveCaretToEnd();
    }
  }

  function finalizeInputLine() {
    if (!inputLineEl || !qInput) return '';
    var val = (qInput.textContent || '').trim();

    qInput.setAttribute('contenteditable', 'false');
    qInput.classList.add('locked');

    var cur = inputLineEl.querySelector('.block-cursor');
    if (cur) {
      cur.classList.add('fading');
      setTimeout(function () {
        if (cur.parentNode) cur.parentNode.removeChild(cur);
      }, 350);
    }

    inputLineEl = null;
    qInput = null;
    scrollBottom();
    return val;
  }

  function removeInputLine() {
    if (inputLineEl && inputLineEl.parentNode) {
      inputLineEl.parentNode.removeChild(inputLineEl);
    }
    inputLineEl = null;
    qInput = null;
  }

  /* ===== 开场 ===== */
  async function boot() {
    state.phase = 'loading';
    termBody.innerHTML = '';
    updateMeta();

    await sleep(400);
    await typeLine('[ OK ] neural-interface v2.0 loaded', 9, 'line-log');
    await sleep(120);
    await typeLine('[ OK ] lateral-thinking module online', 9, 'line-log');
    await sleep(120);
    await typeLine('[ OK ] semantic-decoder ready', 9, 'line-log');
    await sleep(120);
    await typeLine('[ OK ] truth-verification channel open', 9, 'line-log');
    await sleep(500);

    appendLine('', 'line-info');
    await typeLine('> 正在解码汤面 ……', 30, 'line-prompt');
    await sleep(1000);
    appendLine('', 'line-info');

    await typeLine('哥哥因脊髓损伤四肢瘫痪，但呼吸心跳正常。', 32, 'line-soup');
    await sleep(180);
    await typeLine('某天，他给妹妹发来一条消息：', 32, 'line-soup');
    await sleep(240);
    appendLine('', 'line-info');
    await typeLine('「阿妹，我床头那个插线板插头先别关，我晚上还要用。」', 36, 'line-soup-key');
    await sleep(320);
    appendLine('', 'line-info');
    await typeLine('妹妹看到后，立刻拔掉了插线板电源。', 32, 'line-soup');
    await sleep(450);
    appendLine('', 'line-info');

    await typeLine('> 提问规则', 26, 'line-prompt');
    await sleep(150);
    await printLines([
      '  1. 只能问是非题',
      '  2. 系统只回答五种：是 / 不是 / 无关 / 是也不是 / 无法回答',
      '  3. 不能直接猜汤底，必须通过提问逐步推出完整真相',
      '  4. 最多提问 ' + CONFIG.maxQuestions + ' 次'
    ], 15, 'line-info');
    await sleep(350);

    appendLine('', 'line-info');
    await typeLine('> 请在下方输入问题，按 Enter 提交', 24, 'line-prompt');
    await sleep(250);

    setPhase('question');
  }

  /* ===== 提交 ===== */
  async function submitQuestion() {
    if (state.phase !== 'question') return;
    if (!qInput) return;

    var raw = (qInput.textContent || '').trim();
    if (!raw) return;

    var cmd = parseCommand(raw);
    finalizeInputLine();

    /* —— 命令分支：不消耗提问次数 —— */
    if (cmd) {
      await runCommand(cmd);
      return;
    }

    /* —— 普通提问分支 —— */
    state.qCount++;
    updateMeta();
    state.phase = 'answer';
    startDecoding();
  }

  /* ===== 执行内置命令 ===== */
  async function runCommand(kind) {
    if (kind === 'hint') {
      await sleep(160);
      await showHint();
      if (state.phase === 'question') createInputLine();
      return;
    }
    if (kind === 'solution') {
      await sleep(160);
      await reveal();
      return;
    }
  }

  /* ===== 解码动画 ===== */
  function pickDecodeWord() {
    var idx;
    var n = DECODE_WORDS.length;
    if (n === 1) return DECODE_WORDS[0];
    do {
      idx = Math.floor(Math.random() * n);
    } while (idx === lastDecodeIdx);
    lastDecodeIdx = idx;
    return DECODE_WORDS[idx];
  }

  async function startDecoding() {
    var token = ++decodeToken;
    var word = pickDecodeWord();
    var el = appendLine('  ' + word + ' ', 'line-info');
    var frames = ['   ', '.  ', '.. ', '...'];
    var k = 0;

    while (token === decodeToken) {
      el.textContent = '  ' + word + frames[k % 4];
      scrollBottom();
      k++;
      await sleep(150);
    }
    el.textContent = '  ' + word + ' ...';
    scrollBottom();
  }

  /* ===== 判定 ===== */
  async function recordAnswer(num) {
    if (state.phase !== 'answer') return;
    var a = ANSWERS[String(num)];
    if (!a) return;

    state.phase = 'busy';
    decodeToken++;
    await sleep(220);

    var el = appendLine('', 'line-a-record');
    var prefix = '  判定结果：';
    for (var i = 0; i < prefix.length; i++) {
      el.textContent += prefix[i];
      scrollBottom();
      await sleep(35);
    }
    var tag = document.createElement('span');
    tag.className = a.cls;
    tag.textContent = a.text;
    el.appendChild(tag);
    scrollBottom();

    await sleep(600);
    appendLine('', 'line-info');

    if (state.qCount >= CONFIG.maxQuestions) {
      await sleep(300);
      await typeLine('> 提问次数已达上限，即将揭晓真相', 22, 'line-error');
      await sleep(900);
      reveal();
    } else {
      setPhase('question');
    }
  }

  /* ===== 提示 ===== */
  async function showHint() {
    if (hintIndex >= HINTS.length) {
      await typeLine('  [提示] 已无更多提示', 22, 'line-hint');
      appendLine('', 'line-info');
      return;
    }
    var h = HINTS[hintIndex];
    hintIndex++;
    await typeLine('  [提示] ' + h, 22, 'line-hint');
    appendLine('', 'line-info');
  }

  /* ===== 揭晓 ===== */
  async function reveal() {
    if (state.phase === 'revealed') return;
    decodeToken++;
    removeInputLine();
    state.phase = 'revealed';

    flash.classList.add('on');
    await sleep(220);
    flash.classList.remove('on');
    await sleep(450);

    appendLine('', 'line-info');
    await typeLine('════════════════════════════════════', 3, 'line-success');
    await typeLine('          真  相  解  码', 45, 'line-success');
    await typeLine('════════════════════════════════════', 3, 'line-success');
    await sleep(600);
    appendLine('', 'line-info');

    var lines = [
      { t: '哥哥靠联网脑机接口用意念打字交流。',            c: 'line-explain' },
      { t: '他的脑机接口被黑客入侵了。',                    c: 'line-explain' },
      { t: '',                                              c: 'line-info' },
      { t: '黑客想阻止妹妹断网，于是模拟哥哥的脑信号，',      c: 'line-explain' },
      { t: '借他的设备发出消息：',                          c: 'line-explain' },
      { t: '',                                              c: 'line-info' },
      { t: '「阿妹，我床头那个插线板插头先别关，我晚上还要用。」', c: 'line-soup-key' },
      { t: '',                                              c: 'line-info' },
      { t: '那个插线板给家里的路由器供电，拔掉就会断网。',    c: 'line-explain' },
      { t: '黑客怕断网，所以冒充哥哥阻止妹妹。',              c: 'line-explain' },
      { t: '',                                              c: 'line-info' },
      { t: '但黑客不知道：哥哥是年轻人，平时打字从不打句号。', c: 'line-explain' },
      { t: '妹妹看到消息末尾居然有一个句号，立刻意识到',      c: 'line-explain' },
      { t: '这很可能不是哥哥本人发的，而是有人借他的设备在说话。', c: 'line-answer' },
      { t: '',                                              c: 'line-info' },
      { t: '于是她拔掉插线板电源，切断网络，',                c: 'line-explain' },
      { t: '也切断了黑客的入侵链路。',                        c: 'line-explain' },
      { t: '',                                              c: 'line-info' },
      { t: '拔电源不会危及哥哥生命，',                        c: 'line-explain' },
      { t: '只会让他暂时失去脑机接口的交流能力。',            c: 'line-explain' }
    ];

    for (var i = 0; i < lines.length; i++) {
      await typeLine(lines[i].t, 20, lines[i].c);
      await sleep(90);
    }

    await sleep(500);
    appendLine('', 'line-info');
    await typeLine('> 科普点', 26, 'line-prompt');
    await sleep(200);
    await printLines([
      '· 脑机接口让瘫痪患者用意念重新恢复交流能力',
      '· 联网设备的安全风险：脑机接口同样可能被入侵',
      '· 身份验证：如何确认"这条信号真的来自本人"',
      '· 断网不等于断命：脑机接口的供电与安全设计'
    ], 17, 'line-info');

    /* 揭晓后不再显示"按 ↑ 重新开始"提示 */
  }

  /* ===== 全局键盘 ===== */
  window.addEventListener('keydown', function (e) {

    if (e.key === 'ArrowUp' && state.phase !== 'loading') {
      e.preventDefault();
      location.reload();
      return;
    }

    if ((e.key === 'f' || e.key === 'F') && state.phase !== 'question') {
      e.preventDefault();
      toggleFullscreen();
      return;
    }

    if (state.phase === 'answer') {
      if (e.key >= '1' && e.key <= '5') {
        e.preventDefault();
        recordAnswer(e.key);
      }
      return;
    }
  });

  terminal.addEventListener('click', function () {
    if (state.phase === 'question' && qInput) {
      try { qInput.focus(); } catch (e) {}
      moveCaretToEnd();
    }
  });

  function toggleFullscreen() {
    var el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (fn) { try { fn.call(el); } catch (err) {} }
    } else {
      var fx = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (fx) { try { fx.call(document); } catch (err) {} }
    }
  }

  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(boot, 600);
  });

})();
</script>

</body>
</html>
